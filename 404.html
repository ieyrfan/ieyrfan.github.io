<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>404 / Cloud Resource Unresolved — Irfan Cloudspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;overflow:hidden;background:#020617;color:#f8fafc;font-family:Inter,sans-serif}body:before{content:"";position:fixed;inset:-8%;background:url('/asset/cloudspace-hero-v1.webp') center/cover;filter:brightness(.2) saturate(.65);opacity:.58;animation:drift 18s ease-in-out infinite alternate}body:after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    .error{position:relative;z-index:1;width:min(940px,100%);padding:clamp(28px,7vw,76px);border:1px solid rgba(148,163,184,.24);background:rgba(2,6,23,.82);backdrop-filter:blur(16px)}p,small{font:500 9px JetBrains Mono,monospace;letter-spacing:.11em;color:#94a3b8}.visual{position:absolute;right:clamp(22px,6vw,70px);top:clamp(25px,8vw,76px);width:clamp(100px,20vw,190px);height:clamp(72px,14vw,130px)}.cloud{position:absolute;right:0;top:0;width:84px;height:32px;border-radius:50px;background:#dff4ff;box-shadow:-30px 14px 0 8px #dff4ff,25px 15px 0 5px #dff4ff;filter:drop-shadow(0 12px 22px rgba(56,189,248,.18));animation:float 5s ease-in-out infinite}.node{position:absolute;left:4px;bottom:4px;width:10px;height:10px;border:2px solid #38bdf8;background:#07111f;box-shadow:0 0 16px #38bdf8}.line{position:absolute;left:14px;right:40px;bottom:9px;height:1px;background:repeating-linear-gradient(90deg,#38bdf8 0 12px,transparent 12px 20px);animation:reconnect 2.4s steps(5) infinite}.line:after{content:"";position:absolute;right:-4px;top:-3px;width:7px;height:7px;border-radius:50%;background:#f59e0b;box-shadow:0 0 14px #f59e0b}strong{display:block;margin:34px 0 0;font:600 clamp(5.5rem,20vw,13rem)/.74 Space Grotesk,sans-serif;letter-spacing:-.09em;color:#38bdf8}h1{max-width:680px;margin:38px 0 14px;font:500 clamp(2rem,5.8vw,4.8rem)/.95 Space Grotesk,sans-serif;letter-spacing:-.06em}h2{max-width:580px;margin:0 0 36px;color:#94a3b8;font:400 clamp(.95rem,2vw,1.25rem)/1.55 Inter,sans-serif}a{display:inline-flex;justify-content:space-between;gap:42px;min-width:210px;padding:16px 18px;background:#f8fafc;color:#020617;text-decoration:none;font:500 9px JetBrains Mono,monospace;letter-spacing:.07em;transition:transform .25s,background .25s}a:hover{transform:translateY(-3px);background:#dff4ff}small{display:block;margin-top:36px}
    @keyframes drift{to{transform:translate3d(2%,-1%,0) scale(1.03)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes reconnect{50%{opacity:.25;transform:scaleX(.84);transform-origin:left}}@media(max-width:620px){.visual{opacity:.45;right:22px;top:30px}strong{margin-top:70px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="error">
    <p>IRFAN // CLOUDSPACE / ROUTING ERROR</p>
    <div class="visual" aria-hidden="true"><i class="cloud"></i><i class="node"></i><i class="line"></i></div>
    <strong>404</strong>
    <h1>RESOURCE UNRESOLVED.</h1>
    <h2>The requested cloud resource could not be resolved.</h2>
    <a href="/cloud/">RETURN TO CLOUD <span>→</span></a>
    <small>TRACE ID / 404-NODE-RECONNECTING</small>
  </main>
</body>
</html>
